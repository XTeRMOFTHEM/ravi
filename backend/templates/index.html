<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAVI — Connect, Chat, Play</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0A1633; color: #fff; margin: 0; padding: 24px; }
    .card { max-width: 520px; margin: 40px auto; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 20px; padding: 24px; }
    a { color: #38BDF8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>RAVI</h1>
    <p>Signed in as <strong>@{{ current_user.username }}</strong> ({{ current_user.name }})</p>
    <p>Private chats: {{ private_chats_count }} · Followers: {{ follow_counts.followers }} · Following: {{ follow_counts.following }}</p>
    <p><a href="/api/me">/api/me</a> · <a href="/ai">RAVI AI</a> · <a href="/logout">Logout</a></p>
  </div>
  <script>
    window.CURRENT_USER = {{ {
      'id': current_user.id,
      'username': current_user.username,
      'name': current_user.name,
      'avatar': current_user.avatar,
      'chat_bg': current_user.chat_bg
    } | tojson }};
  </script>
</body>
</html>
