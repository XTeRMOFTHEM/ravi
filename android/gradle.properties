org.gradle.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=640m
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=false
android.newDsl=false
android.builtInKotlin=false
kotlin.daemon.jvmargs=-Xmx512m
kotlin.compiler.execution.strategy=in-process
# v1.3.1 — disable Gradle's VFS file-watching (unreliable on overlay/network
# filesystems; stale task state made packaging silently skip native libs).
org.gradle.vfs.watch=false
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
# JDK — resolved automatically from JAVA_HOME / the Android Studio JBR.
# (The old hardcoded /home/z/... path broke every machine except the author's,
# including CI.)
