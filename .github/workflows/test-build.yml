name: Test Build

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check app.py
        run: python -m py_compile backend/app.py

  build-apk:
    name: Build test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.47.9"
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Point app at test backend
        run: |
          sed -i "s|const String kBaseUrl = '<your-backend-url>';|const String kBaseUrl = 'http://195.18.10.82:5000';|" lib/core/constants.dart
          grep -n "kBaseUrl" lib/core/constants.dart

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        run: flutter build apk --debug --no-pub
        continue-on-error: true

      - name: Locate built APK
        run: |
          echo "== outputs =="
          find build android/app/build -name "*.apk" -type f 2>/dev/null | head -20
          APK=$(find build android/app/build -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced by the build."
            exit 1
          fi
          ls -la "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ravi-test-apk
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
