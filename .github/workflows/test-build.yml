name: Test Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend compile & pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies & pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile-check Python sources
        run: python -m py_compile backend/app.py backend/security.py backend/magazine.py backend/tests/test_ravi_backend.py
      - name: Run backend test suite
        run: pytest -v backend/tests/test_ravi_backend.py

  build-apk:
    name: Analyze, unit-test & build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.47.9"
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run offline unit tests
        run: flutter test test/identity_parser_test.dart test/client_logic_test.dart

      - name: Build debug APK
        env:
          RAVI_BASE_URL: ${{ vars.RAVI_TEST_BACKEND_URL }}
        run: |
          if [ -n "$RAVI_BASE_URL" ]; then
            flutter build apk --debug --no-pub --dart-define="RAVI_BASE_URL=$RAVI_BASE_URL"
          else
            flutter build apk --debug --no-pub
          fi

      - name: Locate built APK
        run: |
          echo "== outputs =="
          find build android/app/build -name "*.apk" -type f 2>/dev/null | head -20
          APK=$(find build android/app/build -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced by the build."
            exit 1
          fi
          ls -la "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ravi-test-apk
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
